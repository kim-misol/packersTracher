<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧀 그린베이 패커스 브리핑 트래커</title>
<style>
  :root{
    --gb-green:#203731;
    --gb-green-dark:#152621;
    --gb-gold:#FFB612;
    --ink:#1a1f1d;
    --paper:#f7f6f2;
    --card:#ffffff;
    --muted:#6b7570;
    --line:#e4e2da;
    --new:#2f6fed;
    --update:#1e8e5a;
    --confirmed:#8a3ffc;
    --rumor:#e0790c;
    --upcoming:#6b7570;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;}

  header.hero{background:linear-gradient(135deg,var(--gb-green) 0%,var(--gb-green-dark) 100%);color:#fff;padding:36px 24px 28px;position:relative;overflow:hidden;}
  header.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,182,18,0.18) 0%,transparent 70%);}
  .hero-inner{max-width:1080px;margin:0 auto;position:relative;z-index:1;}
  .hero-eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.06em;color:var(--gb-gold);font-weight:700;text-transform:uppercase;margin-bottom:10px;}
  .hero-title{font-size:24px;font-weight:800;margin:0 0 14px;}
  .hero-quote{font-size:16px;font-weight:500;background:rgba(255,255,255,0.08);border-left:4px solid var(--gb-gold);padding:12px 16px;border-radius:6px;max-width:800px;}
  .hero-date{font-size:13px;color:#cfd8d3;margin-top:10px;}

  .layout{max-width:1080px;margin:0 auto;padding:24px;display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;}
  @media (max-width:820px){ .layout{grid-template-columns:1fr;} }

  /* ── archive sidebar ── */
  .archive{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;}
  .archive-title{font-size:13px;font-weight:800;color:var(--gb-green);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
  .search-box{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13.5px;margin-bottom:10px;}
  .search-box:focus{outline:none;border-color:var(--gb-green);}
  .tag-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tag-filter .filter-chip{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;cursor:pointer;}
  .tag-filter .filter-chip.active{background:var(--gb-green);border-color:var(--gb-green);color:#fff;}
  .month-group{margin-bottom:6px;}
  .month-header{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;color:var(--muted);padding:6px 4px;cursor:pointer;user-select:none;}
  .month-header:hover{color:var(--gb-green);}
  .month-header .chev{transition:.15s;}
  .month-group.collapsed .chev{transform:rotate(-90deg);}
  .month-group.collapsed .archive-list{display:none;}
  .archive-list{list-style:none;margin:0 0 8px;padding:0;}
  .archive-item{border-radius:8px;padding:9px 10px;cursor:pointer;margin-bottom:2px;transition:.12s;}
  .archive-item:hover{background:#f2f1ea;}
  .archive-item.active{background:var(--gb-green);}
  .archive-item.active .ai-date, .archive-item.active .ai-headline{color:#fff;}
  .archive-item .ai-date{font-size:12px;font-weight:800;color:var(--gb-green);}
  .archive-item .ai-headline{font-size:12px;color:#555;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .archive-empty{font-size:12.5px;color:var(--muted);padding:8px 4px;}
  .archive-count{font-size:11px;color:var(--muted);margin-bottom:8px;}

  /* ── main detail ── */
  main{min-width:0;}
  .section-title{font-size:15px;font-weight:800;color:var(--gb-green);text-transform:uppercase;letter-spacing:.04em;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .section-title.spaced{margin-top:32px;}
  .section-title .count{font-size:12px;font-weight:700;color:#fff;background:var(--gb-green);border-radius:10px;padding:1px 8px;}

  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .filter-chip{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;transition:.15s;}
  .filter-chip:hover{border-color:var(--gb-green);color:var(--gb-green);}
  .filter-chip.active{background:var(--gb-green);border-color:var(--gb-green);color:#fff;}

  .story-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;}
  .story-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;box-shadow:0 1px 2px rgba(0,0,0,0.03);transition:.15s;}
  .story-card:hover{box-shadow:0 6px 18px rgba(32,55,49,0.08);transform:translateY(-2px);}
  .story-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .story-title{font-size:16px;font-weight:800;color:var(--ink);}
  .badge{flex-shrink:0;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap;}
  .badge.신규{background:var(--new);}
  .badge.업데이트{background:var(--update);}
  .badge.확정{background:var(--confirmed);}
  .badge.루머{background:var(--rumor);}
  .badge.예정{background:var(--upcoming);}

  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .tag{font-size:11px;font-weight:700;color:var(--gb-green);background:#eef4f1;padding:2px 8px;border-radius:6px;}

  .block-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:10px;}
  .facts{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:#333;}
  .facts li{margin-bottom:3px;}
  .interp{font-size:13.5px;color:var(--gb-green-dark);background:#fbf6e6;border-radius:8px;padding:8px 10px;margin-top:6px;}

  table.tracker{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px;}
  table.tracker th{background:var(--gb-green);color:#fff;text-align:left;font-size:12px;padding:9px 12px;font-weight:700;}
  table.tracker td{padding:9px 12px;border-top:1px solid var(--line);}
  table.tracker tr:nth-child(even) td{background:#fafaf7;}
  .status-pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef4f1;color:var(--gb-green);}
  .status-pill.watch{background:#fff3e0;color:var(--rumor);}

  .move-log{list-style:none;margin:0;padding:0;border-left:2px solid var(--gb-gold);}
  .move-log li{position:relative;padding:2px 0 14px 20px;font-size:14px;}
  .move-log li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gb-gold);border:2px solid var(--gb-green);}
  .move-log .move-date{font-weight:800;color:var(--gb-green);margin-right:6px;}
  .move-log .empty{color:var(--muted);font-size:13.5px;padding-left:0;}
  .move-log .empty::before{display:none;}

  .schedule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .sched-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .sched-card .d{font-weight:800;color:var(--gb-green);font-size:14px;margin-bottom:2px;}
  .sched-card .t{font-size:13px;color:var(--muted);}

  .load-error{background:#fff3e0;border:1px solid #f0c98a;color:#7a4b00;padding:14px 16px;border-radius:10px;font-size:13.5px;}
  .load-error code{background:#fff;padding:1px 5px;border-radius:4px;}

  footer{max-width:1080px;margin:0 auto;padding:20px 24px 60px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">🧀 GREEN BAY PACKERS · DAILY BRIEFING TRACKER</div>
    <h1 class="hero-title">그린베이 패커스 아침 브리핑</h1>
    <div class="hero-quote" id="heroQuote">불러오는 중...</div>
    <div class="hero-date" id="heroDate"></div>
  </div>
</header>

<div class="layout">
  <aside class="archive">
    <div class="archive-title">📂 지난 브리핑 검색</div>
    <input class="search-box" id="searchBox" type="text" placeholder="날짜·키워드 검색 (예: 러브, 부상)">
    <div class="tag-filter" id="tagFilter"></div>
    <div class="archive-count" id="archiveCount"></div>
    <div id="archiveGroups"></div>
  </aside>

  <main id="mainContent">
    <div class="section-title">🔥 스토리라인 <span class="count" id="storyCount">0</span></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="story-grid" id="storyGrid"></div>

    <div class="section-title spaced">🩺 부상 · 뎁스차트 트래커</div>
    <table class="tracker">
      <thead><tr><th>선수</th><th>부위 / 이슈</th><th>현재 상태</th></tr></thead>
      <tbody id="injuryBody"></tbody>
    </table>

    <div class="section-title spaced">🔁 로스터 무브 로그</div>
    <ul class="move-log" id="moveLog"></ul>

    <div class="section-title spaced">📅 다음 일정</div>
    <div class="schedule-grid" id="scheduleGrid"></div>
  </main>
</div>

<footer>
  새 브리핑이 추가되면 <code>data/</code> 폴더에 그 날짜의 JSON 파일 하나와 <code>data/index.json</code> 항목 하나가 늘어나는 구조입니다. 특정 날짜는 주소창의 <code>#YYYY-MM-DD</code>로 바로 공유할 수 있어요.
</footer>

<script>
let archiveIndex = [];      // full data/index.json
let activeTags = new Set(); // selected tag filters
let currentDate = null;

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

async function init(){
  try{
    const res = await fetch('data/index.json');
    if(!res.ok) throw new Error('index.json 응답 오류: ' + res.status);
    archiveIndex = await res.json();
    archiveIndex.sort((a,b) => b.date.localeCompare(a.date));
  } catch(err){
    document.getElementById('mainContent').innerHTML =
      `<div class="load-error">📡 브리핑 목록을 불러오지 못했어요.<br>
      로컬에서 이 파일을 더블클릭으로 열면 브라우저 보안 정책(CORS) 때문에 <code>data/index.json</code>을 읽을 수 없습니다.<br>
      터미널에서 이 폴더로 이동한 뒤 <code>python3 -m http.server</code>를 실행하고 <code>http://localhost:8000</code>으로 접속하거나,
      GitHub Pages에 배포된 주소로 확인해 주세요.<br><br><small>${err.message}</small></div>`;
    return;
  }

  buildTagFilter();
  renderArchiveList();

  window.addEventListener('hashchange', () => loadFromHash());
  loadFromHash();
}

function loadFromHash(){
  const hashDate = decodeURIComponent(location.hash.replace('#',''));
  const target = archiveIndex.find(d => d.date === hashDate) || archiveIndex[0];
  if(target) loadDay(target.date);
}

function buildTagFilter(){
  const allTags = [...new Set(archiveIndex.flatMap(d => d.tags || []))];
  const wrap = document.getElementById('tagFilter');
  wrap.innerHTML = '';
  allTags.forEach(tag=>{
    const chip = el('button','filter-chip', tag);
    chip.addEventListener('click', ()=>{
      if(activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
      chip.classList.toggle('active');
      renderArchiveList();
    });
    wrap.appendChild(chip);
  });
}

function matchesFilters(entry, query){
  const q = query.trim().toLowerCase();
  const textMatch = !q || entry.date.includes(q) || entry.headline.toLowerCase().includes(q);
  const tagMatch = activeTags.size === 0 || (entry.tags || []).some(t => activeTags.has(t));
  return textMatch && tagMatch;
}

function renderArchiveList(){
  const query = document.getElementById('searchBox').value;
  const filtered = archiveIndex.filter(e => matchesFilters(e, query));
  document.getElementById('archiveCount').textContent = `${filtered.length}개 브리핑 (전체 ${archiveIndex.length}개)`;

  const groups = {};
  filtered.forEach(entry=>{
    const ym = entry.date.slice(0,7);
    (groups[ym] = groups[ym] || []).push(entry);
  });

  const wrap = document.getElementById('archiveGroups');
  wrap.innerHTML = '';
  const months = Object.keys(groups).sort().reverse();

  if(months.length === 0){
    wrap.appendChild(el('div','archive-empty','검색 결과가 없어요.'));
    return;
  }

  months.forEach((ym, idx)=>{
    const group = el('div','month-group' + (idx === 0 ? '' : ''));
    const header = el('div','month-header', `<span>${ym} <span style="font-weight:600;color:#aaa;">(${groups[ym].length})</span></span><span class="chev">▾</span>`);
    header.addEventListener('click', ()=> group.classList.toggle('collapsed'));
    group.appendChild(header);

    const list = el('ul','archive-list');
    groups[ym].forEach(entry=>{
      const item = el('li','archive-item' + (entry.date === currentDate ? ' active' : ''));
      item.innerHTML = `<div class="ai-date">${entry.dateLabel || entry.date}</div><div class="ai-headline">${entry.headline}</div>`;
      item.addEventListener('click', ()=>{ location.hash = entry.date; });
      list.appendChild(item);
    });
    group.appendChild(list);
    wrap.appendChild(group);
  });
}

async function loadDay(date){
  currentDate = date;
  renderArchiveList();

  let day;
  try{
    const res = await fetch(`data/${date}.json`);
    if(!res.ok) throw new Error('데이터 로드 실패: ' + res.status);
    day = await res.json();
  } catch(err){
    document.getElementById('mainContent').innerHTML = `<div class="load-error">이 날짜의 데이터를 불러오지 못했습니다. (${err.message})</div>`;
    return;
  }

  document.getElementById('heroQuote').textContent = "💬 " + day.headline;
  document.getElementById('heroDate').textContent = (day.dateLabel || day.date) + " 브리핑";

  const allTags = [...new Set(day.stories.flatMap(s => s.tags))];
  const filterBar = document.getElementById('filterBar');
  filterBar.innerHTML = '';
  const allChip = el('button','filter-chip active','전체');
  allChip.dataset.tag = '__all__';
  filterBar.appendChild(allChip);
  allTags.forEach(tag=>{
    const chip = el('button','filter-chip', tag);
    chip.dataset.tag = tag;
    filterBar.appendChild(chip);
  });
  filterBar.onclick = (e)=>{
    if(e.target.tagName !== 'BUTTON') return;
    [...filterBar.children].forEach(c=>c.classList.remove('active'));
    e.target.classList.add('active');
    const tag = e.target.dataset.tag;
    document.querySelectorAll('.story-card').forEach(card=>{
      card.style.display = (tag === '__all__' || card.dataset.tags.includes(tag)) ? '' : 'none';
    });
  };

  const grid = document.getElementById('storyGrid');
  grid.innerHTML = '';
  document.getElementById('storyCount').textContent = day.stories.length;
  day.stories.forEach(s=>{
    const card = el('div','story-card');
    card.dataset.tags = s.tags.join(',');
    card.innerHTML = `
      <div class="story-top">
        <div class="story-title">${s.icon} ${s.title}</div>
        <span class="badge ${s.status}">${s.status}</span>
      </div>
      <div class="tags">${s.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
      <div class="block-label">팩트</div>
      <ul class="facts">${s.facts.map(f=>`<li>${f}</li>`).join('')}</ul>
      <div class="block-label">패커스 관점</div>
      <div class="interp">${s.interp}</div>
    `;
    grid.appendChild(card);
  });

  const injBody = document.getElementById('injuryBody');
  injBody.innerHTML = '';
  day.injuries.forEach(i=>{
    const tr = el('tr');
    tr.innerHTML = `<td><strong>${i.player}</strong></td><td>${i.issue}</td><td><span class="status-pill ${i.watch?'watch':''}">${i.status}</span></td>`;
    injBody.appendChild(tr);
  });

  const moveLog = document.getElementById('moveLog');
  moveLog.innerHTML = '';
  if(!day.moves || day.moves.length === 0){
    moveLog.appendChild(el('li','empty','이 날짜에는 로스터 무브 없음'));
  } else {
    day.moves.forEach(m=>{
      const li = el('li');
      li.innerHTML = `<span class="move-date">${m.date}</span>${m.text}`;
      moveLog.appendChild(li);
    });
  }

  const schedGrid = document.getElementById('scheduleGrid');
  schedGrid.innerHTML = '';
  (day.schedule || []).forEach(s=>{
    const card = el('div','sched-card');
    card.innerHTML = `<div class="d">${s.date.replace(/\n/g,'<br>')}</div><div class="t">${s.text}</div>`;
    schedGrid.appendChild(card);
  });
}

document.getElementById('searchBox').addEventListener('input', renderArchiveList);

init();
</script>
</body>
</html>
